name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-smoke-tests:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/route-map.js
          node --check chatbot/chat-widget.js
          node --check chatbot/worker.js

      - name: Reject generated Wrangler state
        shell: bash
        run: |
          if git ls-files ':(glob)**/.wrangler/**' | grep -q .; then
            echo 'Generated .wrangler files must not be committed.'
            exit 1
          fi

      - name: Reject tracked secret and database artifacts
        shell: bash
        run: |
          sensitive_pattern='(^|/)(\.env($|\.)|\.dev\.vars($|\.)|id_(rsa|ed25519)($|\.)|[^/]+\.(pem|key|p12|pfx|dump|sqlite|sqlite3|db|sql\.gz)$)'
          tracked_sensitive="$(git ls-files | grep -Ei "$sensitive_pattern" | grep -Ev '(^|/)(\.env\.example|\.dev\.vars\.example)$' || true)"
          if [ -n "$tracked_sensitive" ]; then
            echo "$tracked_sensitive"
            echo 'A credential, private key, or database artifact is tracked.'
            exit 1
          fi
          unexpected_sql="$(git ls-files '*.sql' | grep -vx 'database/schema.sql' || true)"
          if [ -n "$unexpected_sql" ]; then
            echo "$unexpected_sql"
            echo 'Only database/schema.sql may be tracked.'
            exit 1
          fi

      - name: Smoke-test public pages
        shell: bash
        run: |
          php -S 127.0.0.1:8080 -t . >/tmp/tin-tin-php.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for page in \
            index.php \
            about.php \
            contact.php \
            gallery.php \
            budget-plan.php \
            treks/everest-base-camp.php \
            treks/annapurna-base-camp.php \
            treks/langtang-valley.php \
            treks/manaslu-circuit.php \
            treks/upper-dolpo.php
          do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$page" >/dev/null
          done
